openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Flowline live event timing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operator dashboard summaries
  - name: events
    description: Persistent events and run of show data
  - name: agenda
    description: Agenda segment management
  - name: live
    description: Live session control and displays
  - name: workspace
    description: Workspace, team, templates and entitlements
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the operator dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List owned events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event with its live summary
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      responses:
        "204":
          description: Deleted
  /events/{eventId}/agenda:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listAgendaItems
      tags: [agenda]
      summary: List agenda items for an event
      responses:
        "200":
          description: Agenda items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"
    post:
      operationId: createAgendaItem
      tags: [agenda]
      summary: Add an agenda item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaItemInput"
      responses:
        "201":
          description: Created agenda item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaItem"
  /events/{eventId}/agenda/reorder:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: reorderAgendaItems
      tags: [agenda]
      summary: Reorder agenda items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderAgendaInput"
      responses:
        "200":
          description: Reordered agenda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"
  /events/{eventId}/agenda/import-preview:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: previewAgendaImport
      tags: [agenda]
      summary: Parse pasted schedule text into editable agenda items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaImportInput"
      responses:
        "200":
          description: Parsed preview that has not been applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaImportPreview"
  /events/{eventId}/agenda/import:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: applyAgendaImport
      tags: [agenda]
      summary: Atomically add a reviewed agenda import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaImportApplyInput"
      responses:
        "201":
          description: Imported agenda items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"
  /agenda/{itemId}:
    parameters:
      - $ref: "#/components/parameters/AgendaItemId"
    patch:
      operationId: updateAgendaItem
      tags: [agenda]
      summary: Update an agenda item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaItemUpdate"
      responses:
        "200":
          description: Updated agenda item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaItem"
    delete:
      operationId: deleteAgendaItem
      tags: [agenda]
      summary: Delete an agenda item
      responses:
        "204":
          description: Deleted
  /events/{eventId}/displays:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listDisplays
      tags: [live]
      summary: List connected displays for an event
      responses:
        "200":
          description: Displays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Display"
    post:
      operationId: createDisplay
      tags: [live]
      summary: Register a display
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayInput"
      responses:
        "201":
          description: Registered display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
  /displays/{displayId}:
    parameters:
      - $ref: "#/components/parameters/DisplayId"
    patch:
      operationId: updateDisplay
      tags: [live]
      summary: Update a display's name, layout, and public content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayUpdate"
      responses:
        "200":
          description: Updated display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
    delete:
      operationId: deleteDisplay
      tags: [live]
      summary: Remove a display
      responses:
        "204":
          description: Removed
  /events/{eventId}/session:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getLiveSession
      tags: [live]
      summary: Get server-authoritative live session state
      responses:
        "200":
          description: Live session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
    post:
      operationId: controlLiveSession
      tags: [live]
      summary: Apply a deterministic live control command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionControl"
      responses:
        "200":
          description: Updated live session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
        "409":
          description: The supplied revision is stale; reconcile using the returned authoritative session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSessionConflict"
  /events/{eventId}/messages:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: sendOperatorMessage
      tags: [live]
      summary: Send a message to one or more displays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorMessageInput"
      responses:
        "200":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorMessage"
  /events/{eventId}/cues:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: triggerCue
      tags: [live]
      summary: Trigger a production cue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CueInput"
      responses:
        "200":
          description: Triggered cue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cue"
  /events/{eventId}/display-access:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: createDisplayAccess
      tags: [live]
      summary: Create a revocable guest display code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayAccessInput"
      responses:
        "201":
          description: Guest display access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayAccess"
  /display-access/resolve:
    post:
      operationId: resolveDisplayCode
      tags: [live]
      summary: Exchange a guest code for a display token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayCodeInput"
      responses:
        "200":
          description: Resolved guest token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayToken"
        "429":
          description: Too many display-code attempts
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /display-access/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPublicDisplayState
      tags: [live]
      summary: Get read-only timer state using a guest token
      responses:
        "200":
          description: Public display state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDisplayState"
  /display-access/{accessId}/revoke:
    parameters:
      - name: accessId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: revokeDisplayAccess
      tags: [live]
      summary: Revoke guest display access
      responses:
        "204":
          description: Revoked
  /workspace/summary:
    get:
      operationId: getWorkspaceSummary
      tags: [workspace]
      summary: Get the authenticated personal workspace
      responses:
        "200": { description: Workspace summary, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceSummary" } } } }
  /templates:
    get:
      operationId: listTemplates
      tags: [workspace]
      summary: List workspace timer templates
      responses:
        "200": { description: Templates, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TimerTemplate" } } } } }
    post:
      operationId: createTemplate
      tags: [workspace]
      summary: Create a timer template
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TimerTemplateInput" } } } }
      responses:
        "201": { description: Created template, content: { application/json: { schema: { $ref: "#/components/schemas/TimerTemplate" } } } }
  /templates/{templateId}:
    parameters: [ { $ref: "#/components/parameters/TemplateId" } ]
    patch:
      operationId: updateTemplate
      tags: [workspace]
      summary: Update a timer template
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TimerTemplateUpdate" } } } }
      responses:
        "200": { description: Updated template, content: { application/json: { schema: { $ref: "#/components/schemas/TimerTemplate" } } } }
    delete:
      operationId: deleteTemplate
      tags: [workspace]
      summary: Delete a timer template
      responses: { "204": { description: Deleted } }
  /team/members:
    get:
      operationId: listTeamMembers
      tags: [workspace]
      summary: List workspace members
      responses:
        "200": { description: Members, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TeamMember" } } } } }
  /team/members/{memberId}/role:
    parameters: [ { $ref: "#/components/parameters/MemberId" } ]
    patch:
      operationId: updateTeamMemberRole
      tags: [workspace]
      summary: Change a member role
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TeamMemberRoleUpdate" } } } }
      responses:
        "200": { description: Updated member, content: { application/json: { schema: { $ref: "#/components/schemas/TeamMember" } } } }
  /team/invitations:
    get:
      operationId: listInvitations
      tags: [workspace]
      summary: List workspace invitations
      responses:
        "200": { description: Invitations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } }
    post:
      operationId: createInvitation
      tags: [workspace]
      summary: Create a workspace invitation
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationInput" } } } }
      responses:
        "201": { description: Created invitation, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationCreated" } } } }
  /team/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [workspace]
      summary: Accept an invitation for the authenticated email address
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationAcceptanceInput" } } } }
      responses:
        "200": { description: Accepted invitation, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationAcceptance" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /team/invitations/{invitationId}/revoke:
    parameters: [ { $ref: "#/components/parameters/InvitationId" } ]
    post:
      operationId: revokeInvitation
      tags: [workspace]
      summary: Revoke a workspace invitation
      responses: { "204": { description: Revoked } }
  /audit:
    get:
      operationId: listAuditLogs
      tags: [workspace]
      summary: List workspace audit activity
      responses:
        "200": { description: Audit records, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditLog" } } } } }
  /billing:
    get:
      operationId: getBillingEntitlement
      tags: [workspace]
      summary: Get persisted billing state and entitlements
      responses:
        "200": { description: Billing state, content: { application/json: { schema: { $ref: "#/components/schemas/BillingEntitlement" } } } }
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [workspace]
      summary: Create an allowlisted StageTime subscription checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingCheckoutInput" }
      responses:
        "200": { description: Checkout session, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSession" } } } }
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [workspace]
      summary: Create a Stripe customer portal session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingPortalInput" }
      responses:
        "200": { description: Portal session, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSession" } } } }
components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
    AgendaItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    DisplayId:
      name: displayId
      in: path
      required: true
      schema:
        type: string
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { type: string }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Event:
      type: object
      required: [id, name, date, timezone, status, segmentCount, totalPlannedMinutes, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        date: { type: string }
        venue: { type: ["string", "null"] }
        timezone: { type: string }
        status: { type: string, enum: [draft, scheduled, live, completed] }
        segmentCount: { type: integer }
        totalPlannedMinutes: { type: integer }
        behindScheduleMinutes: { type: ["integer", "null"] }
        projectedFinish: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    EventInput:
      type: object
      required: [name, date, timezone]
      properties:
        name: { type: string, minLength: 1 }
        date: { type: string }
        venue: { type: ["string", "null"] }
        timezone: { type: string }
    EventUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        date: { type: string }
        venue: { type: ["string", "null"] }
        timezone: { type: string }
        status: { type: string, enum: [draft, scheduled, live, completed] }
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required: [accessRole, agenda, displays, session]
          properties:
            accessRole: { type: string, enum: [OWNER, ADMIN, OPERATOR, VIEWER] }
            agenda:
              type: array
              items: { $ref: "#/components/schemas/AgendaItem" }
            displays:
              type: array
              items: { $ref: "#/components/schemas/Display" }
            session:
              $ref: "#/components/schemas/LiveSession"
    AgendaItem:
      type: object
      required: [id, eventId, position, title, type, plannedDurationMinutes, warningMinutes, status]
      properties:
        id: { type: string }
        eventId: { type: string }
        position: { type: integer }
        title: { type: string }
        type: { type: string, enum: [opening, keynote, panel, break, transition, video, performance, qa, closing, custom] }
        speaker: { type: ["string", "null"] }
        plannedStart: { type: ["string", "null"] }
        plannedDurationMinutes: { type: integer }
        warningMinutes: { type: integer }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [queued, active, complete, skipped] }
        actualStartedAt: { type: ["string", "null"] }
        actualEndedAt: { type: ["string", "null"] }
    AgendaItemInput:
      type: object
      required: [title, type, plannedDurationMinutes]
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string, enum: [opening, keynote, panel, break, transition, video, performance, qa, closing, custom] }
        speaker: { type: ["string", "null"] }
        plannedStart: { type: ["string", "null"] }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        warningMinutes: { type: integer, minimum: 0 }
        notes: { type: ["string", "null"] }
    AgendaItemUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string, enum: [opening, keynote, panel, break, transition, video, performance, qa, closing, custom] }
        speaker: { type: ["string", "null"] }
        plannedStart: { type: ["string", "null"] }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        warningMinutes: { type: integer, minimum: 0 }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [queued, active, complete, skipped] }
    ReorderAgendaInput:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          items: { type: string }
          minItems: 1
    AgendaImportInput:
      type: object
      required: [source]
      properties:
        source: { type: string, minLength: 1 }
        format: { type: string, enum: [text, csv, document] }
    AgendaImportPreview:
      type: object
      required: [items, warnings, confidence]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgendaItemInput" }
        warnings:
          type: array
          items: { type: string }
        confidence: { type: string, enum: [high, medium, low] }
    AgendaImportApplyInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 250
          items: { $ref: "#/components/schemas/AgendaItemInput" }
    Display:
      type: object
      required: [id, eventId, name, kind, connectionStatus, assignedLayout, currentContent]
      properties:
        id: { type: string }
        eventId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [speaker, stage, audience, backstage] }
        connectionStatus: { type: string, enum: [online, offline, pairing] }
        assignedLayout: { type: string }
        lastSeenAt: { type: ["string", "null"] }
        currentContent: { type: string }
    DisplayInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [speaker, stage, audience, backstage] }
        assignedLayout: { type: string }
    DisplayUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        assignedLayout: { type: string, enum: [focus, speaker, backstage, creator, guest] }
        currentContent: { type: string, maxLength: 160 }
    DisplayAccessInput:
      type: object
      required: [displayId]
      properties:
        displayId: { type: string }
        expiresInMinutes: { type: integer, minimum: 5, maximum: 10080 }
    DisplayAccess:
      type: object
      required: [id, eventId, displayId, code, token, expiresAt]
      properties:
        id: { type: string }
        eventId: { type: string }
        displayId: { type: string }
        code: { type: string }
        token: { type: string }
        expiresAt: { type: string }
    DisplayCodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 8 }
    DisplayToken:
      type: object
      required: [token]
      properties:
        token: { type: string }
    PublicDisplayEvent:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string }
        timezone: { type: string }
    PublicDisplayState:
      type: object
      required: [event, display, agenda, session]
      properties:
        event:
          $ref: "#/components/schemas/PublicDisplayEvent"
        display:
          $ref: "#/components/schemas/Display"
        agenda:
          type: array
          items: { $ref: "#/components/schemas/AgendaItem" }
        session:
          $ref: "#/components/schemas/LiveSession"
    LiveSession:
      type: object
      required: [eventId, state, activeItemId, remainingSeconds, elapsedSeconds, timerAnchorAt, serverTime, revision, operatorMessage, activeCue]
      properties:
        eventId: { type: string }
        state: { type: string, enum: [idle, running, paused, overtime, completed] }
        activeItemId: { type: ["string", "null"] }
        remainingSeconds: { type: integer }
        elapsedSeconds: { type: integer }
        timerAnchorAt: { type: string, description: Server timestamp at which remainingSeconds and elapsedSeconds were captured }
        serverTime: { type: string }
        revision: { type: integer, minimum: 0 }
        startedAt: { type: ["string", "null"] }
        pausedAt: { type: ["string", "null"] }
        operatorMessage: { type: ["string", "null"] }
        activeCue: { type: ["string", "null"] }
    SessionControl:
      type: object
      required: [action, expectedRevision, commandId]
      properties:
        action: { type: string, enum: [start, pause, resume, reset, complete, add_time, subtract_time, next, next_session, previous, restart, jump] }
        expectedRevision: { type: integer, minimum: 0 }
