openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Flowline live event timing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operator dashboard summaries
  - name: events
    description: Persistent events and run of show data
  - name: agenda
    description: Agenda segment management
  - name: live
    description: Live session control and displays
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the operator dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List owned events
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
  /events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event with its live summary
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      responses:
        "204":
          description: Deleted
  /events/{eventId}/agenda:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listAgendaItems
      tags: [agenda]
      summary: List agenda items for an event
      responses:
        "200":
          description: Agenda items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"
    post:
      operationId: createAgendaItem
      tags: [agenda]
      summary: Add an agenda item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaItemInput"
      responses:
        "201":
          description: Created agenda item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaItem"
  /events/{eventId}/agenda/reorder:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: reorderAgendaItems
      tags: [agenda]
      summary: Reorder agenda items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderAgendaInput"
      responses:
        "200":
          description: Reordered agenda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"
  /events/{eventId}/agenda/import-preview:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: previewAgendaImport
      tags: [agenda]
      summary: Parse pasted schedule text into editable agenda items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaImportInput"
      responses:
        "200":
          description: Parsed preview that has not been applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaImportPreview"
  /events/{eventId}/agenda/import:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: applyAgendaImport
      tags: [agenda]
      summary: Atomically add a reviewed agenda import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaImportApplyInput"
      responses:
        "201":
          description: Imported agenda items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgendaItem"
  /agenda/{itemId}:
    parameters:
      - $ref: "#/components/parameters/AgendaItemId"
    patch:
      operationId: updateAgendaItem
      tags: [agenda]
      summary: Update an agenda item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaItemUpdate"
      responses:
        "200":
          description: Updated agenda item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaItem"
    delete:
      operationId: deleteAgendaItem
      tags: [agenda]
      summary: Delete an agenda item
      responses:
        "204":
          description: Deleted
  /events/{eventId}/displays:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: listDisplays
      tags: [live]
      summary: List connected displays for an event
      responses:
        "200":
          description: Displays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Display"
    post:
      operationId: createDisplay
      tags: [live]
      summary: Register a display
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayInput"
      responses:
        "201":
          description: Registered display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Display"
  /displays/{displayId}:
    parameters:
      - $ref: "#/components/parameters/DisplayId"
    delete:
      operationId: deleteDisplay
      tags: [live]
      summary: Remove a display
      responses:
        "204":
          description: Removed
  /events/{eventId}/session:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getLiveSession
      tags: [live]
      summary: Get server-authoritative live session state
      responses:
        "200":
          description: Live session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
    post:
      operationId: controlLiveSession
      tags: [live]
      summary: Apply a deterministic live control command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionControl"
      responses:
        "200":
          description: Updated live session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /events/{eventId}/messages:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: sendOperatorMessage
      tags: [live]
      summary: Send a message to one or more displays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorMessageInput"
      responses:
        "200":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorMessage"
  /events/{eventId}/cues:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: triggerCue
      tags: [live]
      summary: Trigger a production cue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CueInput"
      responses:
        "200":
          description: Triggered cue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cue"
  /events/{eventId}/display-access:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      operationId: createDisplayAccess
      tags: [live]
      summary: Create a revocable guest display code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayAccessInput"
      responses:
        "201":
          description: Guest display access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayAccess"
  /display-access/resolve:
    post:
      operationId: resolveDisplayCode
      tags: [live]
      summary: Exchange a guest code for a display token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayCodeInput"
      responses:
        "200":
          description: Resolved guest token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayToken"
  /display-access/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPublicDisplayState
      tags: [live]
      summary: Get read-only timer state using a guest token
      responses:
        "200":
          description: Public display state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDisplayState"
  /display-access/{accessId}/revoke:
    parameters:
      - name: accessId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: revokeDisplayAccess
      tags: [live]
      summary: Revoke guest display access
      responses:
        "204":
          description: Revoked
components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
    AgendaItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    DisplayId:
      name: displayId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Event:
      type: object
      required: [id, name, date, timezone, status, segmentCount, totalPlannedMinutes, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        date: { type: string }
        venue: { type: ["string", "null"] }
        timezone: { type: string }
        status: { type: string, enum: [draft, scheduled, live, completed] }
        segmentCount: { type: integer }
        totalPlannedMinutes: { type: integer }
        behindScheduleMinutes: { type: integer }
        projectedFinish: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    EventInput:
      type: object
      required: [name, date, timezone]
      properties:
        name: { type: string, minLength: 1 }
        date: { type: string }
        venue: { type: ["string", "null"] }
        timezone: { type: string }
    EventUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        date: { type: string }
        venue: { type: ["string", "null"] }
        timezone: { type: string }
        status: { type: string, enum: [draft, scheduled, live, completed] }
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required: [agenda, displays, session]
          properties:
            agenda:
              type: array
              items: { $ref: "#/components/schemas/AgendaItem" }
            displays:
              type: array
              items: { $ref: "#/components/schemas/Display" }
            session:
              $ref: "#/components/schemas/LiveSession"
    AgendaItem:
      type: object
      required: [id, eventId, position, title, type, plannedDurationMinutes, warningMinutes, status]
      properties:
        id: { type: string }
        eventId: { type: string }
        position: { type: integer }
        title: { type: string }
        type: { type: string, enum: [opening, keynote, panel, break, transition, video, performance, qa, closing, custom] }
        speaker: { type: ["string", "null"] }
        plannedStart: { type: ["string", "null"] }
        plannedDurationMinutes: { type: integer }
        warningMinutes: { type: integer }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [queued, active, complete, skipped] }
        actualStartedAt: { type: ["string", "null"] }
        actualEndedAt: { type: ["string", "null"] }
    AgendaItemInput:
      type: object
      required: [title, type, plannedDurationMinutes]
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string, enum: [opening, keynote, panel, break, transition, video, performance, qa, closing, custom] }
        speaker: { type: ["string", "null"] }
        plannedStart: { type: ["string", "null"] }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        warningMinutes: { type: integer, minimum: 0 }
        notes: { type: ["string", "null"] }
    AgendaItemUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string, enum: [opening, keynote, panel, break, transition, video, performance, qa, closing, custom] }
        speaker: { type: ["string", "null"] }
        plannedStart: { type: ["string", "null"] }
        plannedDurationMinutes: { type: integer, minimum: 1 }
        warningMinutes: { type: integer, minimum: 0 }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [queued, active, complete, skipped] }
    ReorderAgendaInput:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          items: { type: string }
          minItems: 1
    AgendaImportInput:
      type: object
      required: [source]
      properties:
        source: { type: string, minLength: 1 }
        format: { type: string, enum: [text, csv, document] }
    AgendaImportPreview:
      type: object
      required: [items, warnings, confidence]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgendaItemInput" }
        warnings:
          type: array
          items: { type: string }
        confidence: { type: string, enum: [high, medium, low] }
    AgendaImportApplyInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 250
          items: { $ref: "#/components/schemas/AgendaItemInput" }
    Display:
      type: object
      required: [id, eventId, name, kind, connectionStatus, assignedLayout, currentContent]
      properties:
        id: { type: string }
        eventId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [speaker, stage, audience, backstage] }
        connectionStatus: { type: string, enum: [online, offline, pairing] }
        assignedLayout: { type: string }
        lastSeenAt: { type: ["string", "null"] }
        currentContent: { type: string }
    DisplayInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [speaker, stage, audience, backstage] }
        assignedLayout: { type: string }
    DisplayAccessInput:
      type: object
      required: [displayId]
      properties:
        displayId: { type: string }
        expiresInMinutes: { type: integer, minimum: 5, maximum: 10080 }
    DisplayAccess:
      type: object
      required: [id, eventId, displayId, code, token, expiresAt]
      properties:
        id: { type: string }
        eventId: { type: string }
        displayId: { type: string }
        code: { type: string }
        token: { type: string }
        expiresAt: { type: string }
    DisplayCodeInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 8 }
    DisplayToken:
      type: object
      required: [token]
      properties:
        token: { type: string }
    PublicDisplayEvent:
      type: object
      required: [name, timezone]
      properties:
        name: { type: string }
        timezone: { type: string }
    PublicDisplayState:
      type: object
      required: [event, display, agenda, session]
      properties:
        event:
          $ref: "#/components/schemas/PublicDisplayEvent"
        display:
          $ref: "#/components/schemas/Display"
        agenda:
          type: array
          items: { $ref: "#/components/schemas/AgendaItem" }
        session:
          $ref: "#/components/schemas/LiveSession"
    LiveSession:
      type: object
      required: [eventId, state, activeItemId, remainingSeconds, elapsedSeconds, serverTime, operatorMessage, activeCue]
      properties:
        eventId: { type: string }
        state: { type: string, enum: [idle, running, paused, overtime, completed] }
        activeItemId: { type: ["string", "null"] }
        remainingSeconds: { type: integer }
        elapsedSeconds: { type: integer }
        serverTime: { type: string }
        startedAt: { type: ["string", "null"] }
        pausedAt: { type: ["string", "null"] }
        operatorMessage: { type: ["string", "null"] }
        activeCue: { type: ["string", "null"] }
    SessionControl:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [start, pause, resume, reset, add_time, subtract_time, next, previous, restart, jump] }
        amountSeconds: { type: integer, minimum: 1 }
        itemId: { type: ["string", "null"] }
    OperatorMessage:
      type: object
      required: [id, eventId, message, priority, target, expiresAt]
      properties:
        id: { type: string }
        eventId: { type: string }
        message: { type: string }
        priority: { type: string, enum: [normal, urgent] }
        target: { type: string }
        expiresAt: { type: ["string", "null"] }
    OperatorMessageInput:
      type: object
      required: [message, target]
      properties:
        message: { type: string, minLength: 1 }
        priority: { type: string, enum: [normal, urgent] }
        target: { type: string }
        expiresInSeconds: { type: integer, minimum: 1 }
    Cue:
      type: object
      required: [id, eventId, label, triggeredAt]
      properties:
        id: { type: string }
        eventId: { type: string }
        label: { type: string }
        triggeredAt: { type: string }
    CueInput:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1 }
    DashboardSummary:
      type: object
      required: [upcomingEvents, activeEvent, totalEvents, minutesOnAir, recentActivity]
      properties:
        upcomingEvents:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        activeEvent:
          oneOf:
            - $ref: "#/components/schemas/EventDetail"
            - type: "null"
        totalEvents: { type: integer }
        minutesOnAir: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    Activity:
      type: object
      required: [id, label, timestamp, tone]
      properties:
        id: { type: string }
        label: { type: string }
        timestamp: { type: string }
        tone: { type: string, enum: [neutral, positive, warning] }

